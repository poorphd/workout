<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 운동 인증 현황</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --gold: #f1c40f;
    --silver: #c0c4cc;
    --bronze: #cd7f32;
    --l0: #21262d;
    --green: #39d353;
    --green-d: #006d32;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 28px 16px 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 26px; margin-bottom: 4px; }
  header p { color: var(--muted); font-size: 13px; }

  .monthbar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .monthbar label { font-size: 12px; color: var(--muted); }
  select#monthSelect {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px 12px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .stat .num small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  section h2 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
  section h2 .sub { font-size: 11px; color: var(--muted); font-weight: 500; }

  /* leaderboard */
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .rank { width: 26px; text-align: center; font-weight: 800; font-size: 14px; color: var(--muted); flex-shrink: 0; }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); } .rank.r3 { color: var(--bronze); }
  .name { width: 58px; flex-shrink: 0; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-wrap { flex: 1; background: var(--l0); border-radius: 7px; overflow: hidden; height: 24px; }
  .bar { height: 100%; background: linear-gradient(90deg, var(--green-d), var(--green)); border-radius: 7px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; min-width: 30px; transition: width .7s ease; }
  .bar span { font-size: 12px; font-weight: 800; color: #fff; }
  .row-meta { flex-shrink: 0; width: 92px; text-align: right; font-size: 11px; color: var(--muted); }

  /* heatmap */
  .heat-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.heat { border-collapse: collapse; }
  table.heat th, table.heat td { text-align: center; }
  table.heat th.day { font-size: 9px; color: var(--muted); font-weight: 500; padding-bottom: 5px; }
  table.heat td.name-cell { text-align: right; padding-right: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .cell { width: 15px; height: 15px; border-radius: 3px; background: var(--l0); display: inline-block; }
  .cell.on { background: var(--green); }
  .cell.multi { background: var(--green); box-shadow: inset 0 0 0 1.5px #0d1117, 0 0 0 1.5px var(--green); }
  table.heat td { padding: 0; }
  .cell-wrap { padding: 1.5px; }
  .total-cell { font-size: 11px; color: var(--muted); padding-left: 8px; font-weight: 700; white-space: nowrap; }

  /* streaks */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .scard { background: var(--l0); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 10px; }
  .scard .ic { font-size: 22px; }
  .scard .sname { font-weight: 700; font-size: 14px; }
  .scard .sval { font-size: 11px; color: var(--muted); }

  /* weekly goals */
  .goal-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .goal-row .name { width: 58px; }
  .goal-wrap { flex: 1; background: var(--l0); border-radius: 7px; overflow: hidden; height: 22px; position: relative; }
  .goal-bar { height: 100%; border-radius: 7px; transition: width .7s ease; }
  .goal-bar.done { background: linear-gradient(90deg, var(--green-d), var(--green)); }
  .goal-bar.wip { background: linear-gradient(90deg, #1f6feb, var(--accent)); }
  .goal-pct { position: absolute; right: 8px; top: 0; height: 100%; display: flex; align-items: center; font-size: 11px; font-weight: 800; color: var(--text); }
  .goal-meta { width: 64px; text-align: right; font-size: 11px; color: var(--muted); flex-shrink: 0; }

  .legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 12px; }
  .legend .cell { width: 12px; height: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  @media (max-width: 560px) {
    body { padding: 20px 10px 48px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .name, .goal-row .name { width: 48px; }
    .row-meta { width: 70px; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💪 운동 인증 현황</h1>
    <p id="subtitle"></p>
  </header>

  <div class="monthbar">
    <label for="monthSelect">기간</label>
    <select id="monthSelect"></select>
  </div>

  <div id="content"></div>

  <footer>매일 인증으로 잔디를 채워보세요 🌱</footer>
</div>

<script>
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

// Supabase (anon key = public read-only, safe to expose)
const SUPA_URL = "https://hfyjkvypmunvfkwhmhsv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmeWprdnlwbXVudmZrd2htaHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjE1MzAsImV4cCI6MjA5NjIzNzUzMH0.IqFj-YDjG2Rdup8hnefCZPYHn4ZMHm1tXT7Ovl_jVjI";

let MONTHS = [];          // ascending
const DATA = {};          // month -> { "YYYY-MM-DD": [ {name, dur, cal} ] }
const ALLDATES = {};      // name -> Set of "YYYY-MM-DD" (all time)
const GOALS = {};         // name -> weekly_goal
let CUR_MONTH = null;

function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function fmtDur(min) {
  if (!min) return "0분";
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h}시간 ${m}분` : `${m}분`;
}
const comma = (n) => n.toLocaleString("en-US");

async function sb(path) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPA_ANON, Authorization: `Bearer ${SUPA_ANON}` }, cache: "no-cache",
  });
  if (!res.ok) throw new Error(`supabase ${res.status}`);
  return res.json();
}

async function loadData() {
  const [checkins, members] = await Promise.all([
    sb("checkins?select=*&order=checkin_date.asc"),
    sb("members?select=*").catch(() => []),
  ]);
  for (const r of checkins) {
    const date = r.checkin_date, month = date.slice(0, 7);
    (DATA[month] = DATA[month] || {});
    (DATA[month][date] = DATA[month][date] || []).push({
      name: r.nickname, dur: r.duration_min ?? 0, cal: r.calories ?? 0,
    });
    (ALLDATES[r.nickname] = ALLDATES[r.nickname] || new Set()).add(date);
  }
  for (const m of members) if (m.weekly_goal) GOALS[m.nickname] = m.weekly_goal;
  MONTHS = Object.keys(DATA).sort();
}

// longest all-time consecutive-day streak → {len, start, end}
function allTimeStreak(name) {
  const dates = [...(ALLDATES[name] || [])].sort();
  if (!dates.length) return { len: 0 };
  const t = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  let best = 1, bs = dates[0], be = dates[0], cur = 1, cs = dates[0];
  for (let i = 1; i < dates.length; i++) {
    const diff = (t(dates[i]) - t(dates[i - 1])) / 86400000;
    if (diff === 1) cur++; else { cur = 1; cs = dates[i]; }
    if (cur > best) { best = cur; bs = cs; be = dates[i]; }
  }
  return { len: best, start: bs, end: be };
}
const md = (s) => { const [, m, d] = s.split("-").map(Number); return `${m}/${d}`; };

// dates of the current week (Mon..Sun)
function thisWeekDates() {
  const now = new Date();
  const back = (now.getDay() + 6) % 7;
  const mon = new Date(now); mon.setDate(now.getDate() - back);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return fmtDate(d); });
}

function render(monthKey) {
  const [year, month] = monthKey.split("-").map(Number);
  const totalDays = daysInMonth(year, month);
  const data = DATA[monthKey] || {};
  const content = document.getElementById("content");
  document.getElementById("subtitle").textContent = `${year}년 ${MONTH_NAMES[month - 1]}`;

  const dates = Object.keys(data).sort();
  if (!dates.length) {
    content.innerHTML = `<div class="empty">${MONTH_NAMES[month - 1]} 인증 기록이 아직 없어요.</div>`;
    return;
  }

  // per-person aggregation for the month
  const P = {}; // name -> {days:Set, sessions, min, cal}
  let totMin = 0, totCal = 0, totSessions = 0;
  for (const d of dates) {
    const day = Number(d.slice(8, 10));
    for (const r of data[d]) {
      const p = (P[r.name] = P[r.name] || { days: new Set(), sessions: 0, min: 0, cal: 0 });
      p.days.add(day); p.sessions++; p.min += r.dur; p.cal += r.cal;
      totMin += r.dur; totCal += r.cal; totSessions++;
    }
  }
  const ranked = Object.entries(P)
    .map(([name, v]) => ({ name, days: v.days.size, sessions: v.sessions, min: v.min, cal: v.cal, set: v.days }))
    .sort((a, b) => b.days - a.days || a.name.localeCompare(b.name));
  const maxDays = ranked[0].days;

  // tied ranks (Olympic style)
  let prev = null, rank = 0;
  ranked.forEach((r, i) => { if (r.days !== prev) { rank = i + 1; prev = r.days; } r.rank = rank; });

  // stats
  const stats = [
    [`${ranked.length}<small>명</small>`, "참여 인원"],
    [`${dates.length}<small>일</small>`, "운동한 날"],
    [fmtDur(totMin).replace(/(\d+)(시간|분)/g, "$1<small>$2</small>"), "총 운동시간"],
    [`${comma(totCal)}<small>kcal</small>`, "총 칼로리"],
  ].map(([n, l]) => `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join("");

  // leaderboard
  const lb = ranked.map((r) => {
    const pct = (r.days / maxDays * 100).toFixed(1);
    const medal = ["🥇", "🥈", "🥉"][r.rank - 1] || r.rank;
    const rc = r.rank <= 3 ? `r${r.rank}` : "";
    const meta = (r.min || r.cal)
      ? `${r.min ? fmtDur(r.min) : ""}${r.min && r.cal ? " · " : ""}${r.cal ? comma(r.cal) + "kcal" : ""}`
      : (r.sessions > r.days ? `${r.sessions}세션` : "");
    return `<div class="row">
      <div class="rank ${rc}">${medal}</div>
      <div class="name">${r.name}</div>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"><span>${r.days}일</span></div></div>
      <div class="row-meta">${meta}</div>
    </div>`;
  }).join("");

  // heatmap
  const allDays = Array.from({ length: totalDays }, (_, i) => i + 1);
  const head = "<tr><th></th>" + allDays.map((d) => `<th class="day">${d}</th>`).join("") + "<th></th></tr>";
  const rows = ranked.map((r) => {
    const cells = allDays.map((d) => {
      const cls = r.set.has(d) ? " on" : "";
      return `<td><div class="cell-wrap"><div class="cell${cls}"></div></div></td>`;
    }).join("");
    return `<tr><td class="name-cell">${r.name}</td>${cells}<td class="total-cell">${r.days}일</td></tr>`;
  }).join("");

  // streaks (all-time)
  const streaks = ranked.map((r) => ({ name: r.name, ...allTimeStreak(r.name) }))
    .sort((a, b) => b.len - a.len || a.name.localeCompare(b.name));
  const streakCards = streaks.map((s) => {
    const ic = s.len >= 7 ? "🔥🔥" : s.len >= 3 ? "🔥" : "✨";
    const range = s.len > 1 ? `${md(s.start)}~${md(s.end)}` : md(s.start);
    return `<div class="scard"><div class="ic">${ic}</div><div><div class="sname">${s.name}</div><div class="sval">최장 ${s.len}일 · ${range}</div></div></div>`;
  }).join("");

  // weekly goals (current week, independent of selected month)
  const week = thisWeekDates();
  const goalRows = Object.keys(GOALS).map((name) => {
    const set = ALLDATES[name] || new Set();
    const done = week.filter((d) => set.has(d)).length;
    const goal = GOALS[name];
    const pct = Math.round(done / goal * 100);
    return { name, done, goal, pct };
  }).sort((a, b) => b.pct - a.pct || a.name.localeCompare(b.name));
  const goalsHtml = goalRows.length ? goalRows.map((g) => {
    const w = Math.min(100, g.pct);
    const cls = g.pct >= 100 ? "done" : "wip";
    return `<div class="goal-row">
      <div class="name">${g.name}</div>
      <div class="goal-wrap"><div class="goal-bar ${cls}" style="width:${w}%"></div><div class="goal-pct">${g.pct}%</div></div>
      <div class="goal-meta">${g.done}/${g.goal}일</div>
    </div>`;
  }).join("") : `<div class="empty" style="padding:12px 0">아직 주간 목표를 설정한 사람이 없어요. (\`/운동 목표설정 5\`)</div>`;

  content.innerHTML = `
    <div class="stats">${stats}</div>
    <section><h2>🏆 리더보드 <span class="sub">운동 일수 기준</span></h2>${lb}</section>
    <section>
      <h2>🎯 이번주 목표 현황 <span class="sub">월~일</span></h2>${goalsHtml}
    </section>
    <section>
      <h2>🟩 인증 잔디 <span class="sub">사람 × 날짜</span></h2>
      <div class="heat-scroll"><table class="heat">${head}${rows}</table></div>
      <div class="legend"><span>안 함</span><span class="cell"></span><span class="cell on"></span><span>운동</span></div>
    </section>
    <section><h2>🔥 최장 연속 스트릭 <span class="sub">전체 기간</span></h2><div class="grid-cards">${streakCards}</div></section>`;
}

async function init() {
  const sel = document.getElementById("monthSelect");
  try { await loadData(); }
  catch (e) { document.getElementById("content").innerHTML = `<div class="empty">데이터를 불러오지 못했어요.</div>`; return; }
  if (!MONTHS.length) { document.getElementById("content").innerHTML = `<div class="empty">아직 인증 기록이 없어요.</div>`; return; }

  const desc = MONTHS.slice().reverse();
  const now = new Date();
  const cur = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  CUR_MONTH = desc.includes(cur) ? cur : desc[0];

  sel.innerHTML = desc.map((m) => {
    const [y, mo] = m.split("-").map(Number);
    return `<option value="${m}">${y}년 ${MONTH_NAMES[mo - 1]}</option>`;
  }).join("");
  sel.value = CUR_MONTH;
  sel.addEventListener("change", () => { CUR_MONTH = sel.value; render(CUR_MONTH); });
  render(CUR_MONTH);
}

init();
</script>
</body>
</html>
